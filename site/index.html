<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanal-Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Schnitt durch ein Studiogebäude bei Nacht: jede Etage eine Kanalfamilie, jeder Raum ein Kanal. Bewusst nur ein (dunkles) Erscheinungsbild. */
:root{
  --sky-a:#0b1230; --sky-b:#1d2350;
  --wall:#1a1d2b; --wall-2:#22263a; --floor:#2e2a38; --beam:#0d0e15;
  --ink:#eef0f7; --ink-2:#a9aec4; --ink-3:#6f7590;
  --lamp:#ffd27a; --ok:#57d68d; --run:#6cc4ff; --err:#ff6b6b; --off:#4a4e63;
  --panel:#141623; --panel-2:#1c1f30; --line:#2c3047;
  --f-sign:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sky-a);color:var(--ink);font:15px/1.5 var(--f-body);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}

/* Himmel */
#sky{position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--sky-a),var(--sky-b));transition:background 2s}
#stars{position:absolute;inset:0;width:100%;height:100%}

/* Kopfzeile */
header{max-width:1180px;margin:0 auto;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.brand h1{font:900 clamp(34px,6vw,58px)/.9 var(--f-sign);letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--ink-2)}
.clock{font:500 13px var(--f-mono);color:var(--ink-2);text-align:right}
.clock b{display:block;font:900 34px/1 var(--f-sign);color:var(--ink);letter-spacing:.04em}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
.live.stale i{background:var(--lamp);box-shadow:0 0 8px var(--lamp)}

.summary{max-width:1180px;margin:16px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat small{display:block;color:var(--ink-3);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.stat b{font:900 28px/1.1 var(--f-sign);letter-spacing:.03em;font-variant-numeric:tabular-nums}

/* Gebäude */
.building{max-width:1180px;margin:28px auto 0;position:relative}
.roof{height:70px;position:relative;margin:0 6%}
.roof .mast{position:absolute;left:50%;bottom:0;width:6px;height:64px;background:#3a3f57;transform:translateX(-50%)}
.roof .mast::before{content:"";position:absolute;left:-22px;right:-22px;top:18px;height:4px;background:#3a3f57}
.roof .beacon{position:absolute;left:50%;top:-6px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);background:#5a1d1d}
.roof.tx .beacon{background:var(--err);box-shadow:0 0 18px 6px rgba(255,107,107,.6);animation:pulse 1.2s infinite}
.roof .sign{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--beam);border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;
  font:900 18px var(--f-sign);letter-spacing:.3em;color:var(--lamp);text-shadow:0 0 12px rgba(255,210,122,.7);text-transform:uppercase}
.floor{background:var(--beam);padding:10px;border-radius:0}
.floor + .floor{padding-top:0}
.floor:last-of-type{border-radius:0 0 10px 10px}
.flabel{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:2px 4px 8px;color:var(--ink-2);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.flabel b{font:900 18px var(--f-sign);letter-spacing:.08em;color:var(--ink)}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rooms.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.rooms,.rooms.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.rooms,.rooms.four{grid-template-columns:minmax(0,1fr)}}

.room{position:relative;height:210px;border-radius:6px;overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;
  background:linear-gradient(var(--wall-2),var(--wall) 72%,var(--floor) 72%);isolation:isolate;transition:transform .2s,filter .4s}
.room:hover{transform:translateY(-2px)}
.room .scene{position:absolute;inset:0;width:100%;height:100%}
.room::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,rgba(255,210,122,.20),transparent 60%);pointer-events:none;transition:opacity .6s}
.room.idle::after,.room.off::after{opacity:0}
.room.idle .scene{filter:brightness(.62) saturate(.8)}
.room.off .scene{filter:brightness(.28) grayscale(.6)}
.tag{position:absolute;left:10px;top:9px;z-index:3;max-width:calc(100% - 96px);font:900 17px/1 var(--f-sign);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 6px #000}
.tag small{display:block;font:500 10px var(--f-mono);letter-spacing:.04em;color:var(--ink-2);text-transform:none;margin-top:3px}
.chip{position:absolute;right:9px;top:9px;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;
  font:500 11px var(--f-mono);background:rgba(8,9,14,.75);border:1px solid var(--line)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--off)}
.room.run .chip i{background:var(--run);box-shadow:0 0 8px var(--run);animation:pulse 1s infinite}
.room.done .chip i{background:var(--ok)}
.room.err .chip i{background:var(--err);animation:pulse .8s infinite}
.room.err{box-shadow:inset 0 0 0 2px var(--err)}
.bubble{position:absolute;z-index:4;left:50%;bottom:118px;transform:translateX(-10%);max-width:62%;background:#f7f4ea;color:#1b1c25;
  font:700 11px/1.25 var(--f-body);padding:5px 8px;border-radius:8px;opacity:0;transition:opacity .4s;pointer-events:none}
.bubble::after{content:"";position:absolute;left:12px;bottom:-5px;border:6px solid transparent;border-top-color:#f7f4ea;border-bottom:0}
.room.run .bubble,.room.err .bubble{opacity:1}
.foot{position:absolute;left:10px;right:10px;bottom:8px;z-index:3;display:flex;justify-content:space-between;gap:8px;font:500 11px var(--f-mono);color:var(--ink-2);text-shadow:0 1px 4px #000}

/* Figur */
.worker .arm{transform-box:fill-box;transform-origin:10% 50%}
.room.run .worker .arm{animation:type .28s infinite alternate}
.room.run .worker .arm.r{animation-delay:.14s}
.room.run .worker .head{animation:bob 1.6s infinite ease-in-out}
.room.run .screen{animation:flick 1.4s infinite}
.room.done .worker .body{transform:translateY(0)}
.room.done .worker .arm{transform:rotate(-55deg)}
.zzz{opacity:0}
.room.idle .zzz{opacity:1}
.room.idle .zzz text{animation:float 3s infinite linear}
.room.idle .zzz text:nth-child(2){animation-delay:1s}
.room.idle .zzz text:nth-child(3){animation-delay:2s}
.room.idle .worker .head{transform:translate(0,4px) rotate(14deg);transform-box:fill-box;transform-origin:50% 100%}
.room.off .worker{display:none}
.check{opacity:0;transition:opacity .4s}
.room.done .check{opacity:1}
.siren{opacity:0}
.room.err .siren{opacity:1;animation:pulse .7s infinite}

/* Raum-Requisiten */
.rain line{stroke:#9ccfff;stroke-width:1.4;stroke-linecap:round;animation:rain .8s infinite linear}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .5s infinite alternate}
.fall rect.s{animation:fall 1.1s infinite linear}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 9s infinite linear}
.led{animation:blink 1.3s infinite steps(2)}
.ticker{animation:tick 7s infinite linear}

@keyframes pulse{50%{opacity:.35}}
@keyframes type{to{transform:rotate(-9deg)}}
@keyframes bob{50%{transform:translateY(-1.5px)}}
@keyframes flick{0%,100%{opacity:1}40%{opacity:.82}60%{opacity:.95}}
@keyframes float{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(10px,-26px);opacity:0}}
@keyframes rain{from{transform:translateY(-14px)}to{transform:translateY(14px)}}
@keyframes flame{to{transform:scaleY(1.18) scaleX(.92)}}
@keyframes fall{from{transform:translateY(-10px)}to{transform:translateY(10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.2}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-120px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Detail-Schublade */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:20;
  transform:translateX(102%);transition:transform .3s ease;overflow-y:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px}
#drawer.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.open{opacity:1;pointer-events:auto}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h2{font:900 30px/1 var(--f-sign);letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
.dhead p{margin:6px 0 0;color:var(--ink-2)}
.x{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;flex:none}
.sec{margin-top:22px}
.sec h3{font:700 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--panel-2);border-radius:8px;padding:8px 10px}
.kv small{display:block;color:var(--ink-3);font-size:11px}
.kv b{font:900 22px var(--f-sign);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.vid{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none}
.vid img{width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--panel-2)}
.vid .t{font-weight:700;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .m{font:500 11px var(--f-mono);color:var(--ink-2);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font:500 10.5px var(--f-mono);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.pill.sch{color:var(--lamp);border-color:color-mix(in srgb,var(--lamp) 50%,transparent)}
.pill.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,transparent)}
.pill.run{color:var(--run);border-color:color-mix(in srgb,var(--run) 50%,transparent)}
.runrow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;text-decoration:none}
.runrow span:last-child{font:500 11px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.note{color:var(--ink-2);font-size:13px}
.igrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.igrow a{display:block;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:var(--panel-2);position:relative}
.igrow img{width:100%;height:100%;object-fit:cover}
.igrow span{position:absolute;left:4px;right:4px;bottom:4px;font:500 9.5px var(--f-mono);text-shadow:0 1px 3px #000}
/* Kommentar-Postfach */
.inbox{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:7px 14px;border-radius:99px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line);font:700 13px var(--f-body)}
.inbox b{min-width:22px;padding:1px 7px;border-radius:99px;background:var(--off);color:var(--ink);font:500 12px var(--f-mono);text-align:center}
.inbox.has b{background:var(--lamp);color:#1b1c25}
.cmt{border-top:1px solid var(--line);padding:12px 0}
.cmt .who{display:flex;justify-content:space-between;gap:8px;font:500 11px var(--f-mono);color:var(--ink-2)}
.cmt .who a{color:var(--run)}
.cmt q{display:block;margin:6px 0 2px;font-size:14px;quotes:none}
.cmt .ctx{font-size:12px;color:var(--ink-3)}
.cmt textarea{width:100%;min-height:62px;margin-top:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink);font:14px/1.4 var(--f-body);resize:vertical}
.cmt .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.btn{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-size:13px}
.btn.on.ok{background:color-mix(in srgb,var(--ok) 25%,var(--panel-2));border-color:var(--ok)}
.btn.on.no{background:color-mix(in srgb,var(--err) 20%,var(--panel-2));border-color:var(--err)}
.btn.main{background:var(--lamp);color:#1b1c25;border-color:var(--lamp);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.cmt.done{opacity:.45}
.sendbar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin:16px -18px 0;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.keyrow{display:flex;gap:8px;margin-top:8px}
.keyrow input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:13px var(--f-mono)}
footer{max-width:1180px;margin:22px auto 0;color:var(--ink-3);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
</style>
</head>
<body>
<div id="sky"><canvas id="stars"></canvas></div>

<header>
  <div class="brand">
    <h1>Kanal-Studio</h1>
    <p>Alle Kanäle, alle Abläufe – live aus GitHub, YouTube und Instagram.</p>
  </div>
  <div class="clock"><b id="clock">--:--</b><span class="live" id="live"><i></i><span id="freshness">verbinde …</span></span><br>
    <button class="inbox" id="inbox" type="button">💬 Kommentare <b id="inboxN">–</b></button></div>
</header>

<section class="summary" id="summary" aria-label="Überblick"></section>

<main class="building" id="building">
  <div class="roof" id="roof"><div class="mast"></div><div class="beacon"></div><div class="sign">Sendezentrale</div></div>
</main>

<footer>
  <span>Klick auf einen Raum für Details · Figuren: tippt = produziert gerade · ✓ = heute hochgeladen · zzz = wartet auf den nächsten Lauf · rot = Fehler</span>
  <span id="gen"></span>
</footer>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-labelledby="dtitle"></aside>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="desk" viewBox="0 0 160 90">
      <rect x="6" y="52" width="148" height="7" rx="2" fill="#5b4636"/>
      <rect x="14" y="59" width="6" height="31" fill="#46362a"/><rect x="140" y="59" width="6" height="31" fill="#46362a"/>
      <rect x="86" y="14" width="56" height="36" rx="3" fill="#0e1018"/>
      <rect class="screen" x="89" y="17" width="50" height="30" rx="2" fill="var(--scr,#2c6b9e)"/>
      <rect x="110" y="50" width="8" height="3" fill="#0e1018"/>
      <rect x="88" y="49" width="30" height="3" rx="1" fill="#2a2d3a"/>
    </symbol>
  </defs>
</svg>

<script>
"use strict";
const REPO = "McWiebel1995/youtube-automatik";
const API = `https://api.github.com/repos/${REPO}`;
const TZ = "Europe/Berlin";

/* ---------------------------------------------------------------- Räume
   wf: Workflow-Datei · match: erkennt Läufe dieses Raums · lock: Upload-Sperre (heute erledigt) · crons: eigene Zeitpläne */
const FLOORS = [
  { title: "Beyond the If", sub: "3. OG · Weltraum-Studio", rooms: [
    { id: "whatif-video", name: "Lange Videos", sub: "Di + Fr · mit Intro & Outro", ch: "whatif", lock: "whatif", wf: "whatif.yml",
      match: r => /: video/.test(r.display_title), crons: ["15 13 * * 2,5"], days: [2,5], prop: "space", color: "#9d7bff" },
    { id: "whatif-news", name: "News-Short", sub: "täglich · Google News", ch: "whatif", lock: "whatif-news", wf: "whatif.yml",
      match: r => /: news/.test(r.display_title), crons: ["45 11 * * *"], prop: "news", color: "#ff9f5a" },
    { id: "whatif-quiz", name: "Quiz-Short", sub: "täglich · 3 Fragen", ch: "whatif", lock: "whatif-quiz", wf: "whatif.yml",
      match: r => /: quiz/.test(r.display_title), crons: ["5 17 * * *"], prop: "quiz", color: "#5ce0c0" },
  ]},
  { title: "Kinder-Etage", sub: "2. OG · direkt öffentlich", rooms: [
    { id: "schlaf", name: "Mondmelodie", sub: "Spieluhr 14 Min + Short", ch: "schlaf", lock: "kids-schlaf", wf: "kids.yml",
      match: r => /schlaf/.test(r.display_title), crons: ["17 4 * * *"], prop: "moon", color: "#b9a6ff", ig: "mondmelodie" },
    { id: "lernen", name: "Lernbärchen", sub: "eingestellt", ch: "lernen", prop: "board", color: "#ffc857", kind: "paused" },
    { id: "geschichten", name: "Gute-Nacht-Kiste", sub: "Geschichte ~12 Min + Short", ch: "geschichten", lock: "kids-geschichten", wf: "kids.yml",
      match: r => /geschichten/.test(r.display_title), crons: ["47 4 * * *"], prop: "books", color: "#ff8fab", ig: "gutenacht" },
  ]},
  { title: "Calm Haven", sub: "1. OG · Entspannung, online um 02:30", rooms: [
    { id: "regen", name: "Rain", sub: "1–3 h Regen + Short", ch: "regen", lock: "regen", wf: "produce.yml", job: "regen",
      crons: ["7 3 * * *"], prop: "rain", color: "#7cc4ff", ig: "calmhaven" },
    { id: "kamin", name: "Fireside", sub: "1–3 h Kamin + Short", ch: "kamin", lock: "kamin", wf: "produce.yml", job: "kamin",
      crons: ["7 3 * * *"], prop: "fire", color: "#ff9d5c", ig: "calmhaven" },
    { id: "wasserfall", name: "Waters", sub: "1–3 h Wasser + Short", ch: "wasserfall", lock: "wasserfall", wf: "produce.yml", job: "wasserfall",
      crons: ["7 3 * * *"], prop: "water", color: "#5fd6c6", ig: "calmhaven" },
  ]},
  { title: "Erdgeschoss", sub: "Technik & Versand", four: true, rooms: [
    { id: "post", name: "Instagram-Post", sub: "Reels ohne Freigabe", wf: "instagram-post.yml", match: () => true,
      crons: ["37 16 * * *"], prop: "post", color: "#ff7ac6", kind: "ig" },
    { id: "engine", name: "Maschinenraum", sub: "GitHub Actions · Modal-GPU", wf: "*", prop: "engine", color: "#8be08b", kind: "engine" },
    { id: "gedanken", name: "Ruhige Gedanken", sub: "täglich · 12 Min + Short", ch: "gedanken", lock: "gedanken", wf: "gedanken.yml",
      match: () => true, crons: ["13 4 * * *"], prop: "plant", color: "#a7d98a" },
    { id: "anime", name: "Anime", sub: "pausiert", prop: "anime", color: "#ff6b9a", kind: "paused" },
  ]},
];
const ALL = FLOORS.flatMap(f => f.rooms);

/* ---------------------------------------------------------------- Zustand */
let status = null, runs = [], jobs = {}, lastApi = 0, lastStatus = 0;
const etags = {}, cache = {};

async function gh(path) {                          // bedingte Anfragen: 304 zählen nicht gegen das Limit
  const h = { Accept: "application/vnd.github+json" };
  if (etags[path]) h["If-None-Match"] = etags[path];
  const r = await fetch(API + path, { headers: h });
  if (r.status === 304) return cache[path];
  if (!r.ok) throw new Error("GitHub " + r.status);
  etags[path] = r.headers.get("ETag");
  return (cache[path] = await r.json());
}

async function loadRuns() {
  try {
    const d = await gh("/actions/runs?per_page=60");
    runs = d.workflow_runs || [];
    const active = runs.filter(r => r.status !== "completed");
    for (const r of active) {
      const j = await gh(`/actions/runs/${r.id}/jobs`);
      jobs[r.id] = j.jobs || [];
    }
    lastApi = Date.now();
  } catch (e) { console.warn(e); }

/* ---------------------------------------------------------------- Zeit */
const fmt = (d, o) => new Intl.DateTimeFormat("de-DE", { timeZone: TZ, ...o }).format(d);

function field(spec, min, max) {                   // Cron-Feld -> Menge

const wfOf = r => (r.path || "").split("/").pop();

}

    if (room.job && j && j.status !== "in_progress" && j.status !== "queued") continue;
    if (room.job && !j) continue;
    const step = j && (j.steps || []).find(s => s.status === "in_progress");
    return { st: "run", text: r.status === "queued" || (j && j.status === "queued") ? "wartet" : "läuft",

    const last = rr.find(r => r.status === "completed");
    if (last && last.conclusion === "failure") return { st: "err", text: "Fehler", say: "Posten fehlgeschlagen" };
    if (posted) return { st: "done", text: `${posted}/${ig.length} heute`, long: `${posted} von ${ig.length} Konten haben heute gepostet` };
  } else if (doneToday) {

}

  if (room.kind === "ig" && status) html += Object.keys(status.instagram || {}).map(igBlock).join("");
  if (room.kind === "soon") html += `<div class="sec"><p class="note">Testvideos sind fertig (deutsch, Naturbilder, Zitate). Sobald der YouTube-Kanal angelegt ist, zieht der Raum ein.</p></div>`;
  if (room.kind === "paused") html += `<div class="sec"><p class="note">Pausiert. Es laufen keine Produktionen und es wird kein GPU-Guthaben verbraucht.</p></div>`;
  if (rr.length) html += `<div class="sec"><h3>Letzte Läufe</h3>${rr.map(r => `<a class="runrow" href="${esc(r.html_url)}" target="_blank" rel="noopener">
      <span>${runPill(r)} ${esc(r.display_title || r.name)}</span><span>${day(new Date(r.created_at))} ${hm(new Date(r.created_at))}</span></a>`).join("")}</div>`;
  drawer.innerHTML = html;
  drawer.querySelector("#dclose").addEventListener("click", closeDrawer);
  if (!refresh) { drawer.classList.add("open"); scrim.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); drawer.querySelector("#dclose").focus(); }
}

/* ---------------------------------------------------------------- Kommentar-Freigabe
   Vorschläge kommen aus comments.json (Kommentar-Bot, alle 2 h). Freigeben startet den Bot im Modus "send".
   Der GitHub-Schlüssel (nur Actions: Lesen & Schreiben) bleibt ausschließlich in diesem Browser. */
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let comments = [], decisions = LS.get("cmtDecisions", {}), sent = LS.get("cmtSent", {});
async function loadComments() {
  try { const r = await fetch("comments.json?t=" + Date.now()); if (r.ok) comments = (await r.json()).items || []; } catch (e) { console.warn(e); }
  const now = Date.now();
  for (const [id, t] of Object.entries(sent)) if (now - t > 6 * 3600e3 || !comments.some(c => c.id === id)) delete sent[id];
  LS.set("cmtSent", sent);
  updateInbox();
}
const openCmts = () => comments.filter(c => !sent[c.id]);
function updateInbox() {
  const n = openCmts().length, b = document.getElementById("inbox");
  document.getElementById("inboxN").textContent = n; b.classList.toggle("has", n > 0);
}
const ACT = { reply: ["Antwort vorgeschlagen", "ok"], flag: ["Bitte selbst ansehen", "sch"], skip: ["Bot würde ignorieren", ""] };
function openComments() {
  openId = "__comments";
  const list = openCmts().sort((a, b) => ({ reply: 0, flag: 1, skip: 2 }[a.action] - { reply: 0, flag: 1, skip: 2 }[b.action]) || (b.t || "").localeCompare(a.t || ""));
  const key = LS.get("ghKey", "");
  let html = `<div class="dhead"><div><h2 id="dtitle" style="color:var(--lamp)">Kommentare</h2><p>Vorschläge prüfen, bei Bedarf ändern, dann freigeben.</p></div><button class="x" id="dclose" aria-label="Schließen">✕</button></div>`;
  if (!key) html += `<div class="sec"><h3>Einmalig: GitHub-Schlüssel</h3><p class="note">Derselbe Schlüssel wie bei cron-job.org (beginnt mit <code>github_pat_</code>). Er wird nur in diesem Browser gespeichert.</p>
    <div class="keyrow"><input id="ghkey" type="password" autocomplete="off" placeholder="github_pat_…"><button class="btn main" id="savekey">Speichern</button></div></div>`;
  if (!list.length) html += `<div class="sec"><p class="note">Keine offenen Kommentare. Der Bot schaut alle 2 Stunden nach neuen.</p></div>`;
  html += `<div class="sec">` + list.map(c => {
    const d = decisions[c.id] || {}, [lbl, cls] = ACT[c.action] || ACT.skip;
    return `<div class="cmt" data-id="${esc(c.id)}">
      <div class="who"><span>${c.pf === "yt" ? "▶ YouTube" : "◎ Instagram"} · ${esc(c.ch)} · ${esc(c.author)}</span><span>${c.t ? ago(c.t) : ""}${c.url ? ` · <a href="${esc(c.url)}" target="_blank" rel="noopener">öffnen</a>` : ""}</span></div>
      <q>${esc(c.text)}</q><div class="ctx">${c.ctx ? "zu: " + esc(c.ctx) : ""}</div>
      <div class="acts"><span class="pill ${cls}">${lbl}</span>${c.reason && c.action !== "reply" ? `<span class="note">${esc(c.reason)}</span>` : ""}</div>
      <textarea maxlength="500" aria-label="Antwort" placeholder="Antwort schreiben …">${esc(d.reply ?? c.reply)}</textarea>
      <div class="acts"><button class="btn ok ${d.act === "send" ? "on" : ""}" data-a="send">✓ Antworten</button><button class="btn no ${d.act === "skip" ? "on" : ""}" data-a="skip">Ignorieren</button></div></div>`;
  }).join("") + `</div>`;
  const n = Object.entries(decisions).filter(([id, d]) => d.act && list.some(c => c.id === id)).length;
  if (list.length) html += `<div class="sendbar"><span class="note" id="sendmsg">${n ? n + " ausgewählt" : "Wähle „Antworten“ oder „Ignorieren“."}</span>
    <span style="display:flex;gap:8px"><button class="btn" id="allok">Alle Vorschläge annehmen</button><button class="btn main" id="sendnow" ${n && key ? "" : "disabled"}>Freigeben (${n})</button></span></div>`;
  if (key) html += `<p class="note" style="margin-top:14px"><a href="#" id="forget">GitHub-Schlüssel aus diesem Browser löschen</a></p>`;
  drawer.innerHTML = html;
  drawer.querySelector("#dclose").addEventListener("click", closeDrawer);
  const save = () => LS.set("cmtDecisions", decisions);
  drawer.querySelectorAll(".cmt").forEach(el => {
    const id = el.dataset.id, ta = el.querySelector("textarea");
    ta.addEventListener("input", () => { decisions[id] = { ...(decisions[id] || {}), reply: ta.value }; save(); });
    el.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => {
      const a = b.dataset.a, cur = decisions[id] || {};
      decisions[id] = { ...cur, reply: ta.value, act: cur.act === a ? null : a }; save(); openComments();
    }));
  });
  const q = s => drawer.querySelector(s);
  q("#savekey") && q("#savekey").addEventListener("click", () => { const v = q("#ghkey").value.trim(); if (v) { LS.set("ghKey", v); openComments(); } });
  q("#forget") && q("#forget").addEventListener("click", e => { e.preventDefault(); try { localStorage.removeItem("ghKey"); } catch {} openComments(); });
  q("#allok") && q("#allok").addEventListener("click", () => {
    for (const c of list) if (c.action === "reply" && !(decisions[c.id] || {}).act) decisions[c.id] = { reply: (decisions[c.id] || {}).reply ?? c.reply, act: "send" };
    save(); openComments();
  });
  q("#sendnow") && q("#sendnow").addEventListener("click", sendDecisions);
  drawer.classList.add("open"); scrim.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
}
async function sendDecisions() {
  const list = openCmts(), payload = { send: [], skip: [] };
  for (const c of list) {
    const d = decisions[c.id] || {};
    if (d.act === "send" && (d.reply ?? c.reply).trim()) payload.send.push({ id: c.id, reply: (d.reply ?? c.reply).trim().slice(0, 500) });
    if (d.act === "skip") payload.skip.push(c.id);
  }
  const body = JSON.stringify(payload), msg = drawer.querySelector("#sendmsg"), btn = drawer.querySelector("#sendnow");
  if (body.length > 60000) { msg.textContent = "Zu viele auf einmal – bitte in zwei Runden freigeben."; return; }
  btn.disabled = true; msg.textContent = "Sende …";
  try {
    const r = await fetch(API + "/actions/workflows/comments.yml/dispatches", { method: "POST",
      headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + LS.get("ghKey", ""), "Content-Type": "application/json" },
      body: JSON.stringify({ ref: "main", inputs: { mode: "send", payload: body } }) });
    if (r.status === 401 || r.status === 403) throw new Error("Schlüssel ungültig oder ohne Actions-Schreibrecht (" + r.status + ")");
    if (!r.ok) throw new Error("GitHub " + r.status);
    const now = Date.now();
    for (const x of payload.send) { sent[x.id] = now; delete decisions[x.id]; }
    for (const id of payload.skip) { sent[id] = now; delete decisions[id]; }
    LS.set("cmtSent", sent); LS.set("cmtDecisions", decisions);
    updateInbox(); openComments();
    const m = drawer.querySelector("#sendmsg") || drawer.querySelector(".sec .note");
    if (m) m.textContent = `✓ ${payload.send.length} Antworten werden gesendet, ${payload.skip.length} ignoriert – in ca. 1 Minute online.`;
  } catch (e) { msg.textContent = "❌ " + e.message; btn.disabled = false; }
}
document.getElementById("inbox").addEventListener("click", openComments);

/* ---------------------------------------------------------------- Himmel & Uhr */
const cv = document.getElementById("stars"), cx = cv.getContext("2d");
const STARS = Array.from({ length: 160 }, () => [Math.random(), Math.random() * .7, Math.random() * 1.3 + .3, Math.random() * 6]);
function sky() {
  const h = +new Intl.DateTimeFormat("de-DE", { timeZone: TZ, hour: "numeric", hourCycle: "h23" }).formatToParts(new Date()).find(x => x.type === "hour").value;
  const night = h < 6 || h >= 21, dusk = h === 6 || h === 7 || h === 19 || h === 20;
  const [a, b] = night ? ["#070b22", "#1a1f4a"] : dusk ? ["#2a2a5e", "#c9706b"] : ["#3f7fc4", "#a9d4f2"];
  document.documentElement.style.setProperty("--sky-a", a);
  document.documentElement.style.setProperty("--sky-b", b);
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  cx.clearRect(0, 0, cv.width, cv.height);
  if (!night && !dusk) return;
  const t = Date.now() / 1000;
  for (const [x, y, r, p] of STARS) {
    cx.globalAlpha = (night ? .9 : .4) * (.55 + .45 * Math.sin(t + p));
    cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(x * cv.width, y * cv.height, r * devicePixelRatio, 0, 7); cx.fill();
  }
}
function tick() { document.getElementById("clock").textContent = hm(new Date()); }

/* ---------------------------------------------------------------- Start */
async function refreshAll() { await Promise.all([loadRuns(), loadStatus(), loadComments()]); render(); }
tick(); sky(); render(); refreshAll();
setInterval(tick, 10000);
setInterval(sky, 4000);
setInterval(render, 15000);
setInterval(loadRuns, 90000);
setInterval(loadStatus, 300000);
setInterval(loadComments, 300000);
setInterval(render, 92000);
</script>
</body>
</html>
