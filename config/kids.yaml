# ------------------------------------------------------------------
# Kinderkanäle
# Alle Videos werden als "Speziell für Kinder" markiert und ÖFFENTLICH
# hochgeladen (auf Wunsch ohne vorherige Freigabe).
#
# ------------------------------------------------------------------

defaults:
  language: de
  privacy: public            # auf Wunsch direkt öffentlich (vorher: private zur Prüfung in YouTube Studio)
  made_for_kids: true
  # Sprecherstimme (Piper, offline, kostenlos). Andere deutsche Stimmen:
  # de_DE-kerstin-low, de_DE-eva_k-x_low, de_DE-ramona-low, de_DE-thorsten-high
  voice: de_DE-thorsten-medium
  speech_rate: 0.92            # < 1 = langsamer, kinderfreundlich

channels:

  schlaf:
    name: "Mondmelodie"
    token_secret: YT_REFRESH_TOKEN_SCHLAF
    category_id: "10"           # Musik
    playlist_id: ""
    # Täglich: ein Video mit 14 Minuten (unter dem 15-Minuten-Limit) + ein 45-Sekunden-Short
    minutes: 14
    short_seconds: 45
    with_noise_chance: 0.5     # zusätzlich leises Rauschen (beruhigt Babys)
    title_templates:
      - "15 Minuten Einschlafmusik {theme} – sanfte Spieluhr für Babys"
      - "Babys Einschlafmusik {theme} | 15 Min. Spieluhr{noise}"
      - "Spieluhr zum Einschlafen – {theme} (15 Minuten){noise}"
    short_titles:
      - "{greeting} 🌙 Spieluhr zum Einschlafen #shorts"
      - "{greeting} 🌙 Einschlafmusik für Babys #shorts"
      - "{greeting} ✨ Sanfte Spieluhr #shorts #schlaflied"
    themes: ["unter dem Sternenhimmel", "im Mondschein", "für süße Träume", "für ruhige Nächte", "mit Wolken & Sternen"]
    tags: ["Einschlafmusik", "Baby Schlafmusik", "Spieluhr", "Schlaflied", "Babymusik", "Lullaby", "Baby schlafen"]

  lernen:
    name: "dear.zodiac"         # ehemals Lernbärchen, jetzt Astro-Shorts
    token_secret: YT_REFRESH_TOKEN_LERNEN
    category_id: "27"           # Bildung
    playlist_id: ""
    topics: [zahlen, farben, formen]
    title_templates:
      zahlen: ["Zählen lernen von 1 bis {max} 🎈 Zahlen für Kinder", "Wir zählen {things}! Zahlen lernen 1–{max}"]
      farben: ["Farben lernen für Kinder 🌈 {count} Farben", "Welche Farbe ist das? Farben lernen mit {things}"]
      formen: ["Formen lernen für Kinder ⭐ Kreis, Dreieck & Co.", "{count} Formen lernen – Lernvideo für Kleinkinder"]
    mix_titles:
      - "Zahlen, Farben & Formen lernen 🌈 Großes Lernvideo für Kleinkinder"
      - "Lernvideo für Kinder: Zählen, Farben und Formen ⭐ Kita & Vorschule"
      - "Wir lernen Zahlen, Farben & Formen! 🎈 Lernen mit Spaß für Kleinkinder"
      - "Bunte Lernstunde: Zählen, Farben & Formen für Kinder ab 2 🐻"
      - "Farben, Zahlen & Formen mit Quiz 🌈 Lernvideo für Kita-Kinder"
      - "Spielerisch lernen: Zahlen, Farben und Formen ⭐ für Kleinkinder"
      - "Lernbärchen-Lernzeit: zählen, Farben raten, Formen finden 🎈"
    short_titles:
      zahlen: "Zählen bis {n}! 🎈 #shorts #zahlenlernen"
      farben: "Das ist {item}! 🌈 #shorts #farbenlernen"
      formen: "Das ist ein {item}! ⭐ #shorts #formenlernen"
    tags: ["Lernvideo", "Kinder lernen", "Kleinkind", "Vorschule", "Kita", "Zahlen lernen", "Farben lernen", "Formen lernen"]

  geschichten:
    name: "Gute-Nacht-Kiste"
    token_secret: YT_REFRESH_TOKEN_GESCHICHTEN
    category_id: "24"           # Unterhaltung
    playlist_id: ""
    # true = jeden Tag eine neue Geschichte per KI (Gemini, Secret GEMINI_API_KEY; sonst Claude)
    # false = nur Geschichten aus data/stories.yaml (werden der Reihe nach verwendet)
    ai_stories: true
    # Stimme: Chatterbox mit deutscher Referenz (TTS_ENGINE im Workflow). Optional Gemini-TTS: gemini_voice: Sulafat
    short_titles:
      - "{title} 🌙 Mini-Gute-Nacht-Geschichte #shorts"
      - "{title} ✨ Geschichte zum Einschlafen #shorts"
    title_templates:
      - "{title} 🌙 Gute-Nacht-Geschichte für Kinder"
      - "{title} – Einschlafgeschichte zum Zuhören"
    tags: ["Gute Nacht Geschichte", "Einschlafgeschichte", "Hörgeschichte", "Kindergeschichte", "Vorlesen", "Geschichten für Kinder"]
