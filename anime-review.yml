name: "Anime – Freigabe"

# Wird durch die Buttons im Dashboard ausgelöst (es öffnet sich ein vorausgefülltes Issue).
# Nur Issues vom Repo-Besitzer werden ausgeführt – Fremde können nichts freigeben.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: anime-data
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'APPROVE ') || startsWith(github.event.issue.title, 'REJECT '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Entscheidung übernehmen
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          ACTION=$(echo "$TITLE" | awk '{print $1}')
          VID=$(echo "$TITLE" | awk '{print $2}')
          if ! [[ "$VID" =~ ^[A-Za-z0-9_-]{6,20}$ ]]; then echo "Ungültige ID"; exit 1; fi
          NOTE=$(printf '%s' "$BODY" | sed -n '/Notiz (optional):/,$p' | tail -n +2 | head -c 500)
          if [ "$ACTION" = "APPROVE" ]; then A=approve; else A=reject; fi
          python anime/review.py "$A" "$VID" --note "$NOTE"
          git config user.name "anime-review"
          git config user.email "github-actions@users.noreply.github.com"
          git add anime/data
          git commit -m "Freigabe: $A $VID" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          echo "ACTION=$A" >> "$GITHUB_ENV"

      - name: Issue beantworten und schließen
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          if [ "$ACTION" = "approve" ]; then MSG="✅ Freigegeben – das Übergabepaket für KI 2 liegt in anime/data/handoff/."; else MSG="❌ Abgelehnt und im Dashboard markiert."; fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"

      - name: Dashboard bauen
        run: |
          mkdir -p _site
          cp anime/dashboard/index.html _site/
          cp anime/data/candidates.json _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: review
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
