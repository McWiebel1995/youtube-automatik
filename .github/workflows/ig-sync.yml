name: "🔁 Abgleich YouTube ↔ Instagram"
run-name: "Abgleich: ${{ inputs.mode || 'post' }}"

on:
  schedule:
    - cron: "23 13 * * *"     # täglich 14:23 Uhr: fehlende Shorts nachholen (pro Konto 1, Calm Haven 3)
  workflow_dispatch:
    inputs:
      mode:
        description: "list = nur abgleichen · post = Fehlende nachholen"
        type: choice
        options: [list, post, test]
        default: list

permissions:
  contents: write

concurrency:
  group: ig-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: denoland/setup-deno@v2      # yt-dlp braucht eine JS-Laufzeit für YouTube
        with:
          deno-version: v2.x
      - run: pip install -r requirements.txt && pip install -U --pre "yt-dlp[default]"
      - name: Abgleichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_REGEN: ${{ secrets.YT_REFRESH_TOKEN_REGEN }}
          YT_REFRESH_TOKEN_KAMIN: ${{ secrets.YT_REFRESH_TOKEN_KAMIN }}
          YT_REFRESH_TOKEN_WASSERFALL: ${{ secrets.YT_REFRESH_TOKEN_WASSERFALL }}
          YT_REFRESH_TOKEN_SCHLAF: ${{ secrets.YT_REFRESH_TOKEN_SCHLAF }}
          YT_REFRESH_TOKEN_LERNEN: ${{ secrets.YT_REFRESH_TOKEN_LERNEN }}
          YT_REFRESH_TOKEN_GESCHICHTEN: ${{ secrets.YT_REFRESH_TOKEN_GESCHICHTEN }}
          YT_REFRESH_TOKEN_WHATIF: ${{ secrets.YT_REFRESH_TOKEN_WHATIF }}
          IG_TOKEN_CALMHAVEN: ${{ secrets.IG_TOKEN_CALMHAVEN }}
          IG_TOKEN_MONDMELODIE: ${{ secrets.IG_TOKEN_MONDMELODIE }}
          IG_TOKEN_LERNBAERCHEN: ${{ secrets.IG_TOKEN_LERNBAERCHEN }}
          IG_TOKEN_GUTENACHT: ${{ secrets.IG_TOKEN_GUTENACHT }}
          IG_TOKEN_WHATIF: ${{ secrets.IG_TOKEN_WHATIF }}
          IG_WHATIF_ALT: ${{ secrets.IG_USER_WHATIF }}
          IG_USER_WHATIF: ${{ vars.IG_USER_WHATIF }}
          MODE: ${{ inputs.mode || 'post' }}
        run: |
          if [ "$MODE" = test ]; then python scripts/ig_sync.py --test-download xY1zX2en6hk || python scripts/ig_sync.py --list; else python scripts/ig_sync.py --$MODE; fi
      - name: Stand speichern
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for p in data/ig_sync; do [ -e "$p" ] && git add -A "$p" || true; done
          git commit -m "Abgleich YouTube ↔ Instagram" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
