name: "📼 facts_mcwiebel: ältere Shorts nachholen"
run-name: "Nachholen: ${{ inputs.mode || 'post' }}"

on:
  schedule:
    - cron: "23 13 * * *"     # täglich 1 älteres Short (14:23 Uhr), getrennt von News & Quiz
  workflow_dispatch:
    inputs:
      mode:
        description: "list = nur anzeigen · post = 1 Short posten"
        type: choice
        options: [list, post]
        default: list

permissions:
  contents: write

concurrency:
  group: ig-backfill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt yt-dlp
      - name: Nachholen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_WHATIF: ${{ secrets.YT_REFRESH_TOKEN_WHATIF }}
          IG_TOKEN_WHATIF: ${{ secrets.IG_TOKEN_WHATIF }}
          IG_WHATIF_ALT: ${{ secrets.IG_USER_WHATIF }}
          IG_USER_WHATIF: ${{ vars.IG_USER_WHATIF }}
          MODE: ${{ inputs.mode || 'post' }}
        run: |
          if [ "$MODE" = "list" ]; then python scripts/ig_backfill.py --list; else python scripts/ig_backfill.py --post 1; fi
      - name: Stand speichern
        if: always() && (inputs.mode || 'post') == 'post'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for p in data/ig_backfill; do [ -e "$p" ] && git add -A "$p" || true; done
          git commit -m "facts_mcwiebel: Nachholen" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
