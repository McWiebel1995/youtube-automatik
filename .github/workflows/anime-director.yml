name: "Anime – KI 2 Story Director"

# Schreibt Drehbücher für alle freigegebenen Kandidaten ohne Drehbuch.
# Läuft automatisch nach jeder Freigabe und nach jedem Hunter-Lauf; hier auch manuell startbar.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Nur diese Video-ID (leer = alle offenen)"
        default: ""
      force:
        description: "Vorhandenes Drehbuch neu schreiben"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: anime-data
  cancel-in-progress: false

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Drehbücher schreiben
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VID: ${{ github.event.inputs.video_id }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          if [ -n "$VID" ]; then
            [[ "$VID" =~ ^[A-Za-z0-9_-]{6,20}$ ]] || { echo "Ungültige ID"; exit 1; }
            ARGS="--id $VID"
          fi
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          python anime/director.py $ARGS
      - name: Speichern
        run: |
          git config user.name "anime-director"
          git config user.email "github-actions@users.noreply.github.com"
          git add anime/data
          git commit -m "KI 2: Drehbücher" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done; [ $ok = 1 ] || { echo "Speichern fehlgeschlagen"; exit 1; }
      - name: Dashboard bauen
        run: |
          mkdir -p _site
          cp anime/dashboard/*.html _site/
          cp anime/data/candidates.json anime/data/scripts.json anime/data/decisions.json anime/data/productions.json _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: direct
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
