name: "Anime – Freigabe"

# Wird durch die Buttons im Dashboard ausgelöst (es öffnet sich ein vorausgefülltes Issue).
# Nur Issues vom Repo-Besitzer werden ausgeführt – Fremde können nichts freigeben.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: anime-data
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'APPROVE') || startsWith(github.event.issue.title, 'REJECT'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Entscheidung übernehmen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          ACTION=$(echo "$TITLE" | awk '{print $1}')
          VID=$(echo "$TITLE" | awk '{print $2}')
          if ! [[ "$VID" =~ ^[A-Za-z0-9_-]{6,20}$ ]]; then echo "Ungültige ID"; exit 1; fi
          NOTE=$(printf '%s' "$BODY" | sed -n '/Notiz (optional):/,$p' | tail -n +2 | head -c 500)
          case "$ACTION" in
            APPROVE) A=approve ;; REJECT) A=reject ;;
            APPROVE_SCRIPT) A=approve_script ;; REJECT_SCRIPT) A=reject_script ;;
            APPROVE_SHORT) A=approve_short ;; REJECT_SHORT) A=reject_short ;;
            *) echo "Unbekannte Aktion"; exit 1 ;;
          esac
          python anime/review.py "$A" "$VID" --note "$NOTE"
          if [ "$A" = "approve" ]; then
            pip install -q requests
            python anime/director.py --id "$VID" || echo "KI 2 fehlgeschlagen – wird beim nächsten Hunter-Lauf erneut versucht"
          fi
          git config user.name "anime-review"
          git config user.email "github-actions@users.noreply.github.com"
          git add anime/data
          git commit -m "Freigabe: $A $VID" || true
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done; [ $ok = 1 ] || { echo "Speichern fehlgeschlagen"; exit 1; }
          echo "ACTION=$A" >> "$GITHUB_ENV"

      - name: Issue beantworten und schließen
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          case "$ACTION" in
            approve) MSG="✅ Freigegeben – KI 2 hat das Drehbuch geschrieben. Du findest es im Dashboard unter „KI 2 – Anime Story Director“." ;;
            approve_script) MSG="✅ Drehbuch freigegeben." ;;
            approve_short) MSG="✅ Short freigegeben – bereit zur Veröffentlichung." ;;
            *) MSG="❌ Abgelehnt und im Dashboard markiert." ;;
          esac
          if [ "$ACTION" = "approve_script" ]; then
            VID=$(echo "$TITLE" | awk '{print $2}')
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/anime-produce.yml/dispatches" -f ref=main -f "inputs[video_id]=$VID" \
              && MSG="$MSG Die Produktion (KI 3) wurde gestartet." || MSG="$MSG ⚠ Produktion konnte nicht automatisch gestartet werden."
          fi
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"

      - name: Dashboard bauen
        run: |
          mkdir -p _site
          cp anime/dashboard/index.html _site/
          cp anime/data/candidates.json anime/data/scripts.json anime/data/decisions.json anime/data/productions.json _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: review
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
