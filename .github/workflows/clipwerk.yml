name: "🎬 ClipWerk (Windows-Programm) bauen"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/clipwerk.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install pyside6 faster-whisper requests modal pillow pyinstaller
      - name: ffmpeg, Schrift und Symbol holen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/clipwerk/bin, desktop/clipwerk/assets | Out-Null
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName desktop/clipwerk/bin/
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName desktop/clipwerk/bin/
          Invoke-WebRequest https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-ExtraBold.ttf -OutFile desktop/clipwerk/assets/Poppins-ExtraBold.ttf
          python desktop/make_icon.py desktop/clipwerk/assets/clipwerk.ico
      - name: Programm bauen
        working-directory: desktop/clipwerk
        run: >
          pyinstaller --noconfirm --windowed --name ClipWerk --icon assets/clipwerk.ico
          --add-data "assets;assets" --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin"
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all tokenizers
          --collect-submodules modal --collect-data modal --collect-data grpclib --collect-data certifi
          app.py
      - name: Download bereitstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: desktop/clipwerk
        run: |
          Compress-Archive dist/ClipWerk ClipWerk-Windows.zip
          gh release delete clipwerk -y --cleanup-tag 2>$null
          gh release create clipwerk ClipWerk-Windows.zip --title "ClipWerk für Windows" --notes "ZIP herunterladen, entpacken, ClipWerk.exe starten. Beim ersten Start: Weitere Informationen -> Trotzdem ausführen."
      - name: Oberfläche fotografieren
        shell: pwsh
        working-directory: desktop/clipwerk
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bin/ffmpeg.exe -loglevel error -y -f lavfi -i "testsrc2=s=1080x1920:r=30:d=6" -f lavfi -i "sine=d=6" -shortest -c:v libx264 -c:a aac test1.mp4
          $p = Start-Process dist/ClipWerk/ClipWerk.exe -ArgumentList "--screenshots shots test1.mp4" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Warning "Screenshot hing" }
          Get-ChildItem shots -ErrorAction SilentlyContinue
          if (Test-Path shots/seite_1.png) { gh release upload clipwerk (Get-ChildItem shots/*.png).FullName --clobber }
      - name: Selbsttest (Testvideo mit Sprache schneiden)
        shell: pwsh
        working-directory: desktop/clipwerk
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\speech.wav")
          $s.Speak("Today we build a new fence on the farm. First we measure everything. Then the posts go in. At the end it looks really good. What do you think?")
          $s.Dispose()
          bin/ffmpeg.exe -loglevel error -y -f lavfi -i "testsrc2=s=1080x1920:r=30:d=16" -i speech.wav -shortest -c:v libx264 -c:a aac st1.mp4
          $p = Start-Process dist/ClipWerk/ClipWerk.exe -ArgumentList "--selftest st1.mp4" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Warning "Selbsttest hing" }
          if (Test-Path selftest.log) { $log = (Get-Content selftest.log -Raw); Write-Output $log; Write-Output "::notice title=Selbsttest::$(($log -replace "`r?`n", ' | ').Substring(0, [Math]::Min(3500, $log.Length)))" }
          else { Write-Output "::warning title=Selbsttest::kein Protokoll" }
          $reel = Get-ChildItem selftest_out -Filter "01_*.mp4" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($reel) { Copy-Item $reel.FullName selftest_reel.mp4; gh release upload clipwerk selftest_reel.mp4 --clobber }
          else { Write-Error "Selbsttest ohne Ergebnis"; exit 1 }

  stimme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal
      - name: Stimm-KI auf Modal bereitstellen
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy desktop/modal_voice.py
