name: "📸 Instagram-Reels posten"

on:
  schedule:
    - cron: "37 16 * * *"       # täglich ca. 18:37 Uhr (Sommerzeit) / 17:37 Uhr (Winterzeit)
    - cron: "7 18 * * *"        # Absicherung, falls der erste Termin ausfällt (postet nur, was noch offen ist)
  workflow_dispatch:
    inputs:
      account:
        description: "Nur für Test: Konto (calmhaven, mondmelodie, lernbaerchen, gutenacht) – leer = Warteschlange"
        default: ""
      video_url:
        description: "Nur für Test: öffentliche Video-URL"
        default: ""
      caption:
        description: "Nur für Test: Beschreibung"
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Testbeitrag vormerken
        if: github.event.inputs.account != ''
        env:
          ACC: ${{ github.event.inputs.account }}
          URL: ${{ github.event.inputs.video_url }}
          CAP: ${{ github.event.inputs.caption }}
        run: python scripts/ig_queue.py add "$ACC" "$URL" "$CAP"
      - name: Posten
        env:
          IG_TOKEN_CALMHAVEN: ${{ secrets.IG_TOKEN_CALMHAVEN }}
          IG_TOKEN_MONDMELODIE: ${{ secrets.IG_TOKEN_MONDMELODIE }}
          IG_TOKEN_LERNBAERCHEN: ${{ secrets.IG_TOKEN_LERNBAERCHEN }}
          IG_TOKEN_GUTENACHT: ${{ secrets.IG_TOKEN_GUTENACHT }}
        run: python scripts/ig_queue.py post
      - name: Warteschlange speichern
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data/ig_queue data/instagram_queue.json 2>/dev/null || true
          git commit -m "Instagram: Warteschlange aktualisiert" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
