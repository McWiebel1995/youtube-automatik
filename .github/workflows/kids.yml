name: Kinder-Videos produzieren
run-name: "Kinder: ${{ github.event.schedule == '17 4,7,10 * * *' && 'schlaf' || github.event.schedule == '27 4,7,10 * * *' && 'lernen' || github.event.schedule == '47 4,7,10 * * *' && 'geschichten' || inputs.job }}${{ inputs.dry_run && ' (Test)' || '' }}"

# Alle Kinder-Videos werden direkt öffentlich hochgeladen (config/kids.yaml: privacy).
#

on:
  schedule:
    - cron: "17 4,7,10 * * *"   # Schlafkanal: täglich 14-Min-Video + 45-s-Short (+2 Absicherungs-Versuche)
    - cron: "27 4,7,10 * * *"   # Lernkanal: täglich großes Lernvideo (~14 Min.) + Short
    - cron: "47 4,7,10 * * *"   # Geschichten: täglich neue Geschichte (~12 Min.) + Mini-Short
  workflow_dispatch:
    inputs:
      job:
        description: "Was produzieren?"
        type: choice
        options: [schlaf, lernen, lernen-short, lernen-long, geschichten]
        default: lernen
      topic:
        description: "Lernthema (leer = zufällig): zahlen, farben, formen"
        default: ""
      dry_run:
        description: "Nur Testlauf ohne Upload"
        type: boolean
        default: true

permissions:
  contents: write     # um verwendete Geschichten zu merken

concurrency:
  group: kids-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Auftrag bestimmen
        id: job
        run: |
          case "${{ github.event.schedule }}" in
            "17 4,7,10 * * *") JOB=schlaf ;;
            "27 4,7,10 * * *") JOB=lernen ;;
            "47 4,7,10 * * *") JOB=geschichten ;;
            *)                JOB="${{ github.event.inputs.job }}" ;;
          esac
          case "$JOB" in
            schlaf)       ARGS="--channel schlaf" ;;
            lernen)       ARGS="--channel lernen --format both" ;;
            lernen-short) ARGS="--channel lernen --format short" ;;
            lernen-long)  ARGS="--channel lernen --format long" ;;
            geschichten)  ARGS="--channel geschichten" ;;
          esac
          if [ -n "${{ github.event.inputs.topic }}" ] && [[ "$JOB" == lernen* ]]; then
            ARGS="$ARGS --topic ${{ github.event.inputs.topic }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
            [ "$JOB" = "schlaf" ] && ARGS="$ARGS --minutes 2"
            true
          fi
          echo "name=$JOB" >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Auftrag: $JOB ($ARGS)"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt -r requirements-kids.txt

      - name: Stimmen, Schrift & Szenen aus Cache laden
        uses: actions/cache@v4
        with:
          path: |
            assets/voices
            assets/fonts/Kids.ttf
            assets/schlaf/video
            assets/geschichten/video
          key: kids-assets-${{ hashFiles('scripts/kids/visuals.py', 'config/kids.yaml') }}-${{ github.run_id }}
          restore-keys: |
            kids-assets-${{ hashFiles('scripts/kids/visuals.py', 'config/kids.yaml') }}-

      - name: Schriften laden (freie Google Fonts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_fonts.py

      - name: Video produzieren & hochladen
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_SCHLAF: ${{ secrets.YT_REFRESH_TOKEN_SCHLAF }}
          YT_REFRESH_TOKEN_LERNEN: ${{ secrets.YT_REFRESH_TOKEN_LERNEN }}
          YT_REFRESH_TOKEN_GESCHICHTEN: ${{ secrets.YT_REFRESH_TOKEN_GESCHICHTEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TTS_ENGINE: chatterbox
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python scripts/kids/pipeline_kids.py ${{ steps.job.outputs.args }} 2>&1 | tee run.log || {
            echo "::error title=Fehler::$( (grep -E 'File \"/home/runner|Error|error' run.log | tail -n 14) | tr '\n' ' ' | cut -c1-1800)"; exit 1; }

      - name: Verwendete Geschichte merken
        if: steps.job.outputs.name == 'geschichten' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/stories_used.json
          git commit -m "Geschichte als verwendet markiert" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM % 10 + 3)); done

      - name: Upload-Stand & Instagram-Warteschlange speichern
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data/ig_queue data/last_upload data/playlists 2>/dev/null || true
          git commit -m "Upload-Stand + Instagram-Warteschlange" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM % 10 + 3)); done

      - name: Testlauf-Videos als Vorschau-Release ablegen
        if: github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="preview-${{ steps.job.outputs.name }}"
          gh release delete "$TAG" -y --cleanup-tag || true
          mkdir -p _pv
          for f in output/kids-*/video.mp4; do cp "$f" _pv/lang.mp4; done
          for f in output/kids-*/short/video.mp4; do cp "$f" _pv/short.mp4; done
          for f in output/kids-*/thumbnail.jpg; do cp "$f" _pv/thumbnail.jpg; done
          for f in output/kids-*/meta.json; do cp "$f" _pv/meta.json; done
          gh release create "$TAG" _pv/* --title "Vorschau ${{ steps.job.outputs.name }}" --notes "Testlauf" --prerelease

      - name: Ergebnis speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinder-${{ steps.job.outputs.name }}
          path: |
            output/**/meta.json
            output/**/thumbnail.jpg
            ${{ github.event.inputs.dry_run == 'true' && 'output/**/video.mp4' || '' }}
          retention-days: 14
          if-no-files-found: ignore
