name: "🌿 Ruhige Gedanken"
run-name: "Ruhige Gedanken${{ github.event.inputs.dry_run == 'true' && ' (Test)' || '' }}"

on:
  # schedule:                # täglich 05:13 Uhr – erst wieder an, wenn ein Lauf sauber durchgeht
  #   - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      voice:
        description: "Gemini-Stimme (Sulafat, Achernar, Kore, Charon …)"
        default: "Sulafat"
      minutes:
        description: "Länge in Minuten"
        default: "12"
      dry_run:
        description: "Nur Vorschau (nicht hochladen)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt -r requirements-kids.txt
      - name: Schriften laden
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_fonts.py
      - name: Video bauen
        timeout-minutes: 140
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          TTS_ENGINE: chatterbox
          VOICE: ${{ github.event.inputs.voice || 'Sulafat' }}
          MINUTES: ${{ github.event.inputs.minutes || '12' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_GEDANKEN: ${{ secrets.YT_REFRESH_TOKEN_GEDANKEN }}
        run: |
          set -o pipefail
          PUB=""; [ "${{ github.event.inputs.dry_run }}" = "false" ] || [ "${{ github.event_name }}" = "schedule" ] && PUB="--publish"
          python scripts/gedanken.py --out output/gedanken --voice "$VOICE" --minutes "$MINUTES" $PUB 2>&1 | tee run.log || {
            echo "::error title=Fehler::$(tail -n 12 run.log | tr '\n' ' ' | cut -c1-1500)"; exit 1; }
      - name: Protokoll bei Abbruch
        if: failure() || cancelled()
        run: |
          [ -f run.log ] || exit 0
          echo "::warning title=Letzte Schritte::$(grep -v '^\s*$' run.log | tail -n 25 | tr '\n' ' ' | cut -c1-3500)"
          echo "::notice title=Dauer je Schritt::$(grep -E '^(  )?[▶✓⏱🎙🖼🎵]' run.log | tail -n 40 | tr '\n' ' ' | cut -c1-3500)"
      - name: Als Release ablegen
        if: github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview-gedanken -y --cleanup-tag || true
          gh release create preview-gedanken output/gedanken/video.mp4 output/gedanken/short.mp4 output/gedanken/meta.json --title "Vorschau Ruhige Gedanken" --notes "Testlauf" --prerelease
      - name: Stand speichern
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for p in data/last_upload data/covers_used.json; do [ -e "$p" ] && git add -A "$p" || true; done
          git commit -m "Ruhige Gedanken: Stand" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
