name: "Anime – KI 1 Viral Video Hunter"

on:
  schedule:
    - cron: "23 */6 * * *"     # alle 6 Stunden
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: anime-data
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pyyaml google-api-python-client google-auth

      - name: Suchen, prüfen, analysieren, bewerten
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_HUNTER: ${{ secrets.YT_REFRESH_TOKEN_HUNTER }}
          YT_REFRESH_TOKEN_KAMIN: ${{ secrets.YT_REFRESH_TOKEN_KAMIN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python anime/hunter.py
          python anime/director.py   # offene Drehbücher (z. B. nach Gemini-Limit) nachholen

      - name: Ergebnisse speichern
        run: |
          git config user.name "anime-hunter"
          git config user.email "github-actions@users.noreply.github.com"
          git add anime/data
          git commit -m "Hunter: neue Kandidaten" || exit 0
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && ok=1 && break; git rebase --abort 2>/dev/null; sleep $((i*5)); done; [ $ok = 1 ] || { echo "Speichern fehlgeschlagen"; exit 1; }

      - name: Dashboard bauen
        run: |
          mkdir -p _site
          cp anime/dashboard/index.html _site/
          cp anime/data/candidates.json anime/data/scripts.json anime/data/decisions.json _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: hunt
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
