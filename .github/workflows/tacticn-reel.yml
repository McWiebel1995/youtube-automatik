name: "🎯 Tacticn – Zeichen erklärt (Reel)"
run-name: "Tacticn-Reel: ${{ inputs.episode }}"
on:
  workflow_dispatch:
    inputs:
      episode:
        default: infanteriezug
permissions:
  contents: write
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install playwright requests
          python -m playwright install --with-deps chromium
          mkdir -p fonts && curl -sSL -o fonts/Oswald.ttf "https://github.com/google/fonts/raw/main/ofl/oswald/Oswald%5Bwght%5D.ttf"
      - name: Reel bauen
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: python scripts/tacticn_reel.py --episode "${{ inputs.episode }}" --out out --fonts fonts
      - name: Vorschau hochladen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view tacticn-preview >/dev/null 2>&1 || gh release create tacticn-preview --prerelease --title "Tacticn – Vorschau" --notes "Reels zur Freigabe"
          gh release upload tacticn-preview out/*.mp4 out/*.txt out/work/debug_*.png --clobber || true
