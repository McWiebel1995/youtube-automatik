name: "✨ Astro-Karussell (Instagram)"

on:
  schedule:
    - cron: "20 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Vorschau (nicht posten)"
        type: boolean
        default: true
      format:
        description: "Format (leer = automatisch im Wechsel)"
        type: choice
        options: ["", signs, months, message, profilbild, profilbild-gedanken]
        default: ""

permissions:
  contents: write

concurrency:
  group: astro
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt modal pillow
      - name: Schriften laden
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_fonts.py
      - name: Karussell erstellen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          IG_TOKEN_LERNBAERCHEN: ${{ secrets.IG_TOKEN_LERNBAERCHEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_LERNEN: ${{ secrets.YT_REFRESH_TOKEN_LERNEN }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          IG_USER_ASTRO: ${{ vars.IG_USER_ASTRO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ARGS="--out output/astro"
          if [ "${{ github.event.inputs.format }}" = "profilbild" ]; then python scripts/astro.py --avatar --out output/astro; exit 0; fi
          if [ "${{ github.event.inputs.format }}" = "profilbild-gedanken" ]; then AVATAR_SET=gedanken python scripts/astro.py --avatar --out output/astro; exit 0; fi
          [ -n "${{ github.event.inputs.format }}" ] && ARGS="$ARGS --format ${{ github.event.inputs.format }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -z "$IG_TOKEN_LERNBAERCHEN" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/astro.py $ARGS 2>&1 | tee run.log || {
            echo "::error title=Fehler::$( (grep -E 'File \"/home/runner|Error|error' run.log | tail -n 14) | tr '\n' ' ' | cut -c1-1800)"; exit 1; }
      - name: Vorschau ablegen
        if: github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview-astro -y --cleanup-tag || true
          gh release create preview-astro $(ls output/astro/*.jpg output/astro/*.png output/astro/*.mp4 output/astro/meta.json 2>/dev/null) --title "Vorschau Astro" --notes "Testlauf" --prerelease
      - name: Stand speichern
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for p in data/astro_used.json data/last_upload; do [ -e "$p" ] && git add -A "$p" || true; done
          git commit -m "Astro: Stand" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
