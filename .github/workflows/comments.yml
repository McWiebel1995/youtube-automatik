name: "💬 Kommentar-Bot (YouTube & Instagram)"
run-name: "Kommentare: ${{ github.event.inputs.mode || 'suggest' }}"

on:
  schedule:
    - cron: "17 */2 * * *"     # alle 2 Stunden: Vorschläge sammeln -> Freigabe im Studio
  workflow_dispatch:
    inputs:
      mode:
        description: "suggest = Vorschläge fürs Studio · send = Freigaben senden · probe · dry-run · live = ohne Freigabe"
        type: choice
        options: [suggest, send, probe, dry-run, live]
        default: suggest
      payload:
        description: "nur für send (kommt aus dem Studio)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: comment-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kommentare bearbeiten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_REGEN: ${{ secrets.YT_REFRESH_TOKEN_REGEN }}
          YT_REFRESH_TOKEN_KAMIN: ${{ secrets.YT_REFRESH_TOKEN_KAMIN }}
          YT_REFRESH_TOKEN_WASSERFALL: ${{ secrets.YT_REFRESH_TOKEN_WASSERFALL }}
          YT_REFRESH_TOKEN_LERNEN: ${{ secrets.YT_REFRESH_TOKEN_LERNEN }}
          YT_REFRESH_TOKEN_WHATIF: ${{ secrets.YT_REFRESH_TOKEN_WHATIF }}
          YT_REFRESH_TOKEN_GEDANKEN: ${{ secrets.YT_REFRESH_TOKEN_GEDANKEN }}
          IG_TOKEN_CALMHAVEN: ${{ secrets.IG_TOKEN_CALMHAVEN }}
          IG_TOKEN_MONDMELODIE: ${{ secrets.IG_TOKEN_MONDMELODIE }}
          IG_TOKEN_LERNBAERCHEN: ${{ secrets.IG_TOKEN_LERNBAERCHEN }}
          IG_TOKEN_GUTENACHT: ${{ secrets.IG_TOKEN_GUTENACHT }}
          IG_TOKEN_WHATIF: ${{ secrets.IG_TOKEN_WHATIF }}
          IG_WHATIF_ALT: ${{ secrets.IG_USER_WHATIF }}
          IG_USER_WHATIF: ${{ vars.IG_USER_WHATIF }}
          MODE: ${{ github.event.inputs.mode || 'suggest' }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          ARGS=""
          [ "$MODE" = "probe" ] && ARGS="--probe"
          [ "$MODE" = "dry-run" ] && ARGS="--dry-run"
          [ "$MODE" = "suggest" ] && ARGS="--suggest"
          if [ "$MODE" = "send" ]; then printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/send.json"; ARGS="--send $RUNNER_TEMP/send.json"; fi
          python scripts/comment_bot.py $ARGS
      - name: Stand speichern
        if: always() && github.event.inputs.mode != 'probe' && github.event.inputs.mode != 'dry-run'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          [ -e data/comment_bot ] && git add -A data/comment_bot || true
          git commit -m "Kommentar-Bot: Stand" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
