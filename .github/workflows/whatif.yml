name: "🌌 Beyond the If – What-if-Video"
run-name: "Beyond the If: ${{ (github.event.schedule == '45 11 * * *' || github.event.schedule == '45 14 * * *') && 'news' || (github.event.schedule == '5 17 * * *' || github.event.schedule == '5 19 * * *') && 'quiz' || github.event.schedule && 'video' || inputs.mode == 'news-short' && 'news' || inputs.mode || 'video' }}${{ inputs.dry_run && ' (Test)' || '' }}"

on:
  schedule:
    - cron: "15 13 * * 2,5"     # Di + Fr: langes Video + 2 Shorts
    - cron: "15 16 * * 2,5"     # Absicherung
    - cron: "45 11 * * *"       # täglich: News-Short (Algorithmus-Test)
    - cron: "45 14 * * *"       # Absicherung
    - cron: "5 17 * * *"        # täglich: Quiz-Short
    - cron: "5 19 * * *"        # Absicherung
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Testlauf (Vorschau-Release, kein Upload)"
        type: boolean
        default: true
      minutes:
        description: "Länge in Minuten"
        default: "9"
      mode:
        description: "video oder news-short"
        type: choice
        options: [video, news-short, quiz]
        default: video

permissions:
  contents: write

concurrency:
  group: whatif
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt modal faster-whisper
      - name: Schriften laden
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_fonts.py
      - name: Produzieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_WHATIF: ${{ secrets.YT_REFRESH_TOKEN_WHATIF }}
          IG_TOKEN_WHATIF: ${{ secrets.IG_TOKEN_WHATIF }}
          IG_WHATIF_ALT: ${{ secrets.IG_USER_WHATIF }}
          IG_USER_WHATIF: ${{ vars.IG_USER_WHATIF }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ARGS="--out output/whatif --minutes ${{ github.event.inputs.minutes || '9' }}"
          case "${{ github.event.schedule }}" in "45 11 * * *"|"45 14 * * *") ARGS="$ARGS --news-short" ;; esac
          [ "${{ github.event.inputs.mode }}" = "news-short" ] && ARGS="$ARGS --news-short"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          SCRIPT=scripts/whatif.py
          case "${{ github.event.schedule }}" in "5 17 * * *"|"5 19 * * *") SCRIPT=scripts/quiz.py ;; esac
          [ "${{ github.event.inputs.mode }}" = "quiz" ] && SCRIPT=scripts/quiz.py
          [ "$SCRIPT" = scripts/quiz.py ] && ARGS="--out output/whatif$(echo "$ARGS" | grep -o ' --dry-run' || true)"
          python $SCRIPT $ARGS 2>&1 | tee run.log || {
            echo "::error title=Fehler::$( (grep -E 'File \"/home/runner|Error|error' run.log | tail -n 14) | tr '\n' ' ' | cut -c1-1800)"; exit 1; }
      - name: Vorschau ablegen
        if: github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview-whatif -y --cleanup-tag || true
          gh release create preview-whatif $(ls output/whatif/*.mp4 output/whatif/*.json 2>/dev/null) --title "Vorschau Beyond the If" --notes "Testlauf" --prerelease
      - name: Stand speichern
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for p in data/whatif_used.json data/quiz_used.json data/last_upload data/playlists data/ig_queue; do [ -e "$p" ] && git add -A "$p" || true; done
          git commit -m "Beyond the If: Stand" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
