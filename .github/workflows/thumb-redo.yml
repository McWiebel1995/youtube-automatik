name: "🖼 Thumbnails nachträglich erneuern (Beyond the If)"

on:
  workflow_dispatch:
    inputs:
      days:
        description: "lange Videos der letzten X Tage"
        default: "14"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Schriften laden
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_fonts.py
      - name: Erneuern
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_WHATIF: ${{ secrets.YT_REFRESH_TOKEN_WHATIF }}
        run: python scripts/thumb_redo.py --days ${{ inputs.days }} > t.log 2>&1 || { echo "::error::$(tail -n 15 t.log | tr '\n' ' ' | cut -c1-2000)"; exit 1; }; cat t.log
      - name: Ablegen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data/thumb_redo.json || true
          git commit -m "Thumbnails erneuert" && for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done || true
          ls output/thumb_redo/*.jpg 2>/dev/null | grep -v _bg || exit 0
          gh release delete thumb-redo -y --cleanup-tag || true
          gh release create thumb-redo $(ls output/thumb_redo/*.jpg | grep -v _bg) --title "Erneuerte Thumbnails" --notes "Beyond the If" --prerelease
