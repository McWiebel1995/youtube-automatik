# Gute-Nacht-Geschichten (eigene Texte). Neue einfach unten anhängen.
# Jede Geschichte: title + paragraphs (Absätze). Kurze Sätze lesen sich am schönsten vor.

- title: "Der kleine Igel und der Mond"
  paragraphs:
    - "Am Rand eines großen Waldes wohnte ein kleiner Igel. Er hieß Pieks. Pieks hatte eine weiche Nase, kleine schwarze Augen und ganz viele Stacheln auf dem Rücken."
    - "Jeden Abend, wenn die Sonne hinter den Hügeln verschwand, kroch Pieks aus seinem Blätterhaus. Er schnupperte an den Blumen. Er hörte den Grillen zu. Und er schaute hinauf zum Himmel."
    - "Eines Abends sah Pieks etwas Wunderschönes. Über den Bäumen hing ein großer, runder, leuchtender Mond. Der Mond sah aus wie ein Apfel aus Licht."
    - "Den möchte ich haben, dachte Pieks. Er streckte sich ganz lang. Er stellte sich auf die Zehenspitzen. Aber der Mond war viel zu hoch."
    - "Da kam die alte Eule geflogen. Sie setzte sich auf einen Ast und fragte: Was machst du da, kleiner Pieks? Ich möchte den Mond pflücken, sagte Pieks. Die Eule lachte leise. Den Mond kann man nicht pflücken, sagte sie. Aber du kannst ihn behalten. Schau mal in die Pfütze."
    - "Pieks drehte sich um. In der kleinen Pfütze neben seinem Haus schwamm ein zweiter Mond. Er glitzerte und wackelte ein bisschen, wenn der Wind über das Wasser strich."
    - "Pieks legte sich neben die Pfütze. Der Mond oben am Himmel leuchtete. Der Mond in der Pfütze leuchtete auch. Und beide schauten auf den kleinen Igel."
    - "Gute Nacht, Mond, flüsterte Pieks. Er rollte sich zu einer kleinen, runden Kugel zusammen. Und während der Mond über den Wald wanderte, schlief Pieks ganz tief und fest ein. Gute Nacht."

- title: "Die Wolke, die nicht regnen wollte"
  paragraphs:
    - "Hoch oben am Himmel lebte eine kleine, weiße Wolke. Sie hieß Flocke. Flocke war weich wie Watte und leicht wie eine Feder."
    - "Die anderen Wolken waren groß und grau. Sie ließen es regnen, damit die Blumen trinken konnten. Aber Flocke wollte nicht regnen. Sie wollte lieber über die Welt schweben und alles anschauen."
    - "Sie schwebte über einen blauen See. Sie schwebte über eine Wiese voller Schafe. Sie schwebte über ein kleines Dorf mit roten Dächern."
    - "Dann sah Flocke einen Garten. In dem Garten stand eine kleine Sonnenblume. Ihre Blätter hingen nach unten, und ihr Kopf war ganz müde. Ich habe so großen Durst, flüsterte die Sonnenblume."
    - "Flocke dachte lange nach. Dann holte sie tief Luft, und ganz sanft fielen ein paar Tropfen aus ihr heraus. Tropf. Tropf. Tropf. Die Sonnenblume trank und trank. Langsam hob sie ihren Kopf. Danke, kleine Wolke, sagte sie und lächelte."
    - "Flocke fühlte sich ganz warm und froh. Helfen ist schön, dachte sie."
    - "Als es Abend wurde, färbte sich der Himmel rosa und golden. Flocke kuschelte sich an einen Berg. Die Sterne gingen an, einer nach dem anderen. Und die kleine Wolke schlief ein, ganz weich und ganz leicht. Schlaf schön, kleine Flocke. Und schlaf schön, du."

- title: "Bär Brummi kann nicht einschlafen"
  paragraphs:
    - "Es war Herbst. Die Blätter waren gelb und rot, und es wurde jeden Tag ein bisschen kälter. Bär Brummi wusste: Bald ist es Zeit für den Winterschlaf."
    - "Brummi legte sich in seine Höhle. Er machte die Augen zu. Aber er konnte nicht einschlafen. Er drehte sich nach links. Er drehte sich nach rechts. Es ging einfach nicht."
    - "Da hörte er ein Klopfen. Es war das Eichhörnchen. Ich habe dir Nüsse mitgebracht, sagte es. Damit du keinen Hunger hast. Danke, sagte Brummi. Aber ich kann trotzdem nicht schlafen."
    - "Dann kam der Hase. Ich habe dir weiches Moos mitgebracht, sagte er. Damit du gemütlich liegst. Danke, sagte Brummi und legte sich auf das Moos. Es war schön weich. Aber schlafen konnte er immer noch nicht."
    - "Zum Schluss kam die kleine Maus. Sie hatte nichts dabei. Sie setzte sich einfach neben Brummi und sagte: Soll ich dir ein Lied summen?"
    - "Brummi nickte. Die Maus summte ganz leise. Hmm, hmm, hmm. Draußen fielen die Blätter. Hmm, hmm, hmm. Der Wind sang mit. Brummis Augen wurden schwer. Seine Atemzüge wurden langsam und tief."
    - "Als die Maus aufhörte zu summen, schlief Brummi schon. Er lächelte im Schlaf. Und er träumte von Honig, von Sonnenschein und von seinen Freunden, die im Frühling auf ihn warten. Gute Nacht, Brummi."

- title: "Das Glühwürmchen Lumi"
  paragraphs:
    - "In einer warmen Sommernacht wurde auf einer Wiese ein kleines Glühwürmchen geboren. Es hieß Lumi."
    - "Alle anderen Glühwürmchen leuchteten schon hell. Sie flogen über das Gras und tanzten zwischen den Blumen. Nur Lumi leuchtete noch nicht. Ihr kleines Licht blieb dunkel."
    - "Lumi war traurig. Sie setzte sich auf ein Kleeblatt und schaute den anderen zu. Da kam eine Grille vorbei. Warum bist du so traurig? fragte die Grille. Ich kann nicht leuchten, sagte Lumi leise."
    - "Die Grille dachte nach. Weißt du, sagte sie, ein Licht kann man nicht erzwingen. Es kommt, wenn du dich freust. Was macht dich denn froh?"
    - "Lumi überlegte. Der Duft von Blumen macht mich froh, sagte sie. Und das Plätschern vom Bach. Und wenn jemand nett zu mir ist, so wie du."
    - "Und während Lumi an all die schönen Dinge dachte, wurde ihr ganz warm im Bauch. Erst ein kleiner Funke. Dann ein sanftes Glimmen. Und dann leuchtete Lumi! Gelb und warm, wie ein kleiner Stern."
    - "Lumi flog los. Sie tanzte mit den anderen über die Wiese, über den Bach und bis zum Fenster eines kleinen Hauses. Dort lag ein Kind im Bett und schaute hinaus. Lumi leuchtete extra hell, nur für das Kind. Das Kind lächelte und schloss die Augen. Gute Nacht, sagte Lumi. Gute Nacht."

- title: "Die Reise des kleinen Bootes"
  paragraphs:
    - "Am Ufer eines stillen Sees lag ein kleines, rotes Boot. Es hatte ein weißes Segel und hieß Paddel."
    - "Paddel wollte so gerne einmal über den ganzen See fahren. Bis ans andere Ufer, wo die großen Weiden stehen. Eines Abends blies ein sanfter Wind. Jetzt, dachte Paddel. Jetzt geht es los."
    - "Das Segel blähte sich, und Paddel glitt hinaus auf das Wasser. Die kleinen Wellen machten plitsch und platsch an seinem Bauch. Eine Ente schwamm neben ihm her. Wohin fährst du? fragte sie. Zu den Weiden, sagte Paddel stolz."
    - "Ein Fisch sprang aus dem Wasser und machte einen Bogen. Eine Libelle setzte sich kurz auf das Segel und flog dann weiter. Die Sonne ging unter, und der See wurde golden, dann rosa, dann dunkelblau."
    - "Als Paddel die Weiden erreichte, war es schon Nacht. Die Weiden ließen ihre langen Zweige ins Wasser hängen, wie einen grünen Vorhang. Dahinter war es still und geschützt."
    - "Paddel schaukelte ganz sanft. Hin und her. Hin und her. Oben leuchteten die Sterne, und im Wasser leuchteten sie auch. Das war der schönste Ort, den Paddel je gesehen hatte."
    - "Morgen erzähle ich allen von meiner Reise, dachte Paddel. Aber jetzt wird geschlafen. Und das kleine Boot schaukelte sich in den Schlaf. Hin und her. Hin und her. Gute Nacht, kleines Boot."

- title: "Wie die Sterne an den Himmel kamen"
  paragraphs:
    - "Vor langer, langer Zeit war der Nachthimmel ganz dunkel. Es gab keinen einzigen Stern. Nur der Mond war da, und der Mond war ein bisschen einsam."
    - "Unten auf der Erde lebte ein kleines Mädchen. Es hieß Ella. Jeden Abend schaute Ella aus dem Fenster und sagte: Armer Mond. Du bist ganz allein da oben."
    - "Eines Nachts hatte Ella eine Idee. Sie nahm ihr Glas mit den gesammelten Sonnenstrahlen. Den ganzen Sommer hatte sie jeden Tag einen Sonnenstrahl hineingetan. Das Glas leuchtete warm und golden."
    - "Ella stieg auf den höchsten Hügel. Dort öffnete sie das Glas. Und die Sonnenstrahlen flogen heraus. Sie flogen hoch und höher, immer weiter, bis zum Himmel. Und dort blieben sie hängen, als kleine funkelnde Punkte."
    - "Der Mond staunte. Um ihn herum glitzerten auf einmal hunderte kleine Lichter. Sie zwinkerten ihm zu. Der Mond war nicht mehr allein."
    - "Danke, Ella, flüsterte der Mond. Und seitdem leuchten die Sterne jede Nacht. Sie leuchten für den Mond. Und sie leuchten für alle Kinder, die aus dem Fenster schauen."
    - "Wenn du heute Abend in den Himmel schaust, dann zwinkert dir vielleicht auch ein Stern zu. Mach die Augen zu, und zwinker ganz leise zurück. Gute Nacht."

- title: "Die kleine Schnecke hat Zeit"
  paragraphs:
    - "Im Garten wohnte eine kleine Schnecke. Sie hieß Lotti. Lotti trug ihr Haus immer auf dem Rücken, und sie war sehr, sehr langsam."
    - "Beeil dich, Lotti! rief die Ameise. Wir haben viel zu tun! Beeil dich, Lotti! summte die Biene. Die Blumen warten! Aber Lotti lächelte nur und kroch weiter. Ganz langsam."
    - "Weil Lotti so langsam war, sah sie Dinge, die die anderen nicht sahen. Sie sah, wie ein Tautropfen auf einem Blatt glitzerte. Sie sah, wie ein Marienkäfer seine Flügel putzte. Sie sah, wie sich eine Blüte ganz langsam schloss, weil es Abend wurde."
    - "Am Abend saßen alle Tiere zusammen. Die Ameise war müde. Die Biene war müde. Was hast du heute gesehen, Lotti? fragten sie."
    - "Und Lotti erzählte. Vom glitzernden Tautropfen. Vom Marienkäfer. Von der Blüte, die schlafen ging. Die Tiere hörten ganz still zu. So schöne Dinge, sagte die Biene leise. Die haben wir gar nicht bemerkt."
    - "Manchmal ist langsam ganz wunderbar, sagte Lotti. Dann kroch sie in ihr Haus. Es war klein und rund und gemütlich. Draußen gingen die Sterne an. Und drinnen schlief die kleine Schnecke ein. Ganz langsam. Ganz ruhig. Gute Nacht, Lotti."

- title: "Der Fuchs, der die Stille suchte"
  paragraphs:
    - "Im Wald lebte ein junger Fuchs mit einem buschigen, roten Schwanz. Er hieß Finn. Finn war neugierig und wollte alles wissen."
    - "Eines Tages hörte er, wie die alten Tiere von der Stille sprachen. Die Stille ist das Schönste im ganzen Wald, sagte der Dachs. Finn spitzte die Ohren. Die Stille? Die muss ich finden!"
    - "Finn lief zum Bach. Aber der Bach plätscherte. Er lief zur Wiese. Aber dort zirpten die Grillen. Er lief zum großen Baum. Aber dort raschelten die Blätter im Wind."
    - "Erschöpft legte sich Finn ins weiche Gras. Er schaute in den Himmel, der langsam dunkel wurde. Ich habe die Stille nicht gefunden, seufzte er."
    - "Da setzte sich die Eule neben ihn. Die Stille kann man nicht suchen, sagte sie. Man muss nur ganz ruhig werden. Mach die Augen zu und atme ganz langsam."
    - "Finn machte die Augen zu. Er atmete ein. Und aus. Ein. Und aus. Der Bach plätscherte noch, aber ganz weit weg. Die Grillen zirpten noch, aber ganz leise. Und in seinem Bauch wurde es warm und ruhig."
    - "Das ist die Stille, flüsterte Finn. Sie war die ganze Zeit in mir. Die Eule nickte. Und der kleine Fuchs rollte sich zusammen, legte seinen buschigen Schwanz über die Nase und schlief ein. Atme mit ihm. Ein. Und aus. Gute Nacht."
